#Goal - to ensure no secrets have been leaked in the code.

name: Secret Scanning
on:
    workflow_call: # you can call this workfow before/after another workfow

jobs: 
    secret-scanning:
        runs-on: ubuntu-latest
        steps:
             - name: Checkout Code
               uses: actions/checkout@v7
               with:
                   fetch-depth: 0 # fetch a full history so that we can scan all commits 
             - name: Gitleaks Secret Scanning
               uses: gitleaks/gitleaks-action@v3
               env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # pile line variable to authenticate with the Github api
                  

                  
               