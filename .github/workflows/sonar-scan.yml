#Goal - to check whether the applicatoin code coverage doesn't have security threats.

name: Sonar Qube Scan

on:
    workflow_call

jobs: 
    sonar-scanner:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7
              
            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@8.2.0 # Ex: v4.1.0 or sha1, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  
                SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}
                


   