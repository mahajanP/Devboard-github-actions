#Goal - to check whether the applicatoin code coverage doesn't have security threats.

name: Sonar Qube Scan

on:
  #workflow_call
  workflow_dispatch:

jobs:
  sonar-scanner:
    runs-on: self-hosted

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


   