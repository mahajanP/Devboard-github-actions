#Goal to instal lmultiple versoins of go and do linting for multiple versions

name: Go Linter

on: 
    workflow_dispatchs:

jobs:

    code-format:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                go: ['1.22', '1.23', '1.24']
        steps:
            - name: checkout cosde
              uses: actions/checkout@v7
              with:
                

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                go-version: ${{ matrix.go}}
                go-version-file: 'go.mod'
                cache-dependency-path: go.sum    


            - name:  Run Go Formattercd
              run: go fmt
              working-directory: backend

            - name: Run Go Vet
              run: go vet
              working-directory: backend

              

             

