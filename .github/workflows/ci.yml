#Goal - I have to lint, build, test the code, for frontned and backend, then push the images no the docker hub
#TDD - test driven depolyment

name: CI

on:

  push:
    branches: [advanced]
jobs: 
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with: 
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install npm Packages
        working-directory: frontend
        run: npm install

      - name: Run Linter
        working-directory: frontend
        run:  npm run lint

      - name: Run Tests
        working-directory: frontend
        run: npm run test
      
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend-nodjs:latest  


        
   
        





  

