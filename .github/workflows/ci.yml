#Goal - I have to lint, build, test the code, for frontned and backend, then push the images no the docker hub
#TDD - test driven depolyment

name: CI

on:

  push:
    branches: [advanced]
jobs: 
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with: 
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.lock.json
      - name: Install npm Packages
        run: npm install

      - name: Run Linter
        run:  npm run lint

      - name: Run Tests
        run: npm run test
      # Push


        
   
        





  

