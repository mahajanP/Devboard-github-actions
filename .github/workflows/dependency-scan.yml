#Goal - I have to ensure the packages & dependencies have been audited to security.

name: Dependency Scan 

on:
    workflow_call: # you can call this workfolw before/after another workfow

jobs:
    dependency-scan:
        runs-on: ubuntu-latest
        steps:
                - name: Checkout Code
                  uses: actions/checkout@v7

                - name: Setup Go #setup go for backend
                  uses: actions/setup-go@v4
                  with:
                    go-version: "1.22"
                    go-version-file: 'go.mod'
                    cache-dependency-path: go.sum
                - name: Install Govulncheck
                  run: go install golang.org/x/vuln/cmd/govulncheck@latest
                  
                - name: GoVulncheck Scan
                  continue-on-error: true #job not stop if any valnerability found
                  run: govulncheck ./... > govulncheck-report.txt
                  working-directory: backend

                - name: Setup Node
                  uses: actions/setup-node@v6
                  with:
                    node-version: '20'
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json

                - name: Run Dependency Scan for Node
                  run: npm audit
                  working-directory: frontend

                - name: Upload Job Report
                  uses: actions/upload-artifact@v4
                  with:
                    name: dependency-scan-report # The name of the downloaded zip file
                    path: reports/dependency-report.txt # Path to your file (e.g., report.html, test-results.xml)
                    retention-days: 5 # Optional: Defaults to 90 days   
            
               
                  

              
                

