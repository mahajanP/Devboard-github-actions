# Goal: To deploy the built images from CI Steps once the CI Worklow is Succeeded

name: CD

on:
  #workflow_call:
   workflow_call:
    inputs:
      IMAGE_TAG:
        required: true
        type: string
      DOCKERHUB_USERNAME:
        required: false
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Copy Example Env to main env
        run: cp .env.example .env

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy the containers with Docker Compose
        env:
          IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
          DOCKERHUB_USERNAME: ${{ inputs.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
        run: |
          docker compose pull
          docker compose up -d --no-build
