# Goal: build and push the backend and frontend images to Docker Hub.

name: Docker Push

on:
  workflow_call:
    inputs:
      IMAGE_TAG:
        required: false
        type: string

jobs:
  push-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ['backend', 'frontend']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.folder }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}:${{ inputs.IMAGE_TAG || github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folder }}:latest
 
